version: 2
updates:
  # 每月检查一次；同一生态的更新合并成一个 PR，且最多保留 1 条。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ["*"]
    open-pull-requests-limit: 1

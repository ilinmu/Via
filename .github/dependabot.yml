version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/core"
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: "/platforms/android"
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: "/platforms/windows"
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: "/platforms/windows.tests"
    schedule:
      interval: weekly

version: 2
updates:
  # 每月检查一次；同一生态的更新合并成一个 PR，且最多保留 1 条。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # jni 的主版本升级会改 API，现有代码无法直接编译，暂不自动跟进。
  - package-ecosystem: cargo
    directory: "/core"
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 1

  # Gradle/AGP 的主版本升级会破坏当前 Android 构建，暂不自动跟进。
  - package-ecosystem: gradle
    directory: "/platforms/android"
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 1

  - package-ecosystem: nuget
    directory: "/platforms/windows"
    schedule:
      interval: monthly
    groups:
      nuget-windows:
        patterns: ["*"]
    open-pull-requests-limit: 1

  - package-ecosystem: nuget
    directory: "/platforms/windows.tests"
    schedule:
      interval: monthly
    groups:
      nuget-tests:
        patterns: ["*"]
    open-pull-requests-limit: 1

name: Cross-platform CI

on:
  # Pull requests are tested through `pull_request`; pushing a branch twice
  # would otherwise run the whole pipeline twice. Master still gets a full run
  # for every commit so a release can rely on it.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its previous run. Master runs get a
# unique group each, so no commit's run is ever replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with the app version (scripts/package-app.sh, Android
  # versionName). Each master build becomes v<APP_VERSION>.<run_number>.
  APP_VERSION: "1.0"

jobs:
  # Pull requests that only touch prose skip the platform jobs. The filter is a
  # job rather than a workflow-level `paths` filter so every check still gets
  # reported (as skipped) instead of staying pending forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  core-tests:
    name: Core tests (Rust)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Run workspace tests
        run: cargo test --manifest-path core/Cargo.toml --workspace

  macos-tests:
    name: macOS tests (Swift + Rust)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        run: cargo build --manifest-path core/Cargo.toml -p autowifi-ffi --release

      # The release build of the app itself is covered by build-macos; running
      # it here as well only repeats work.
      - name: Run Swift tests
        run: swift test

  windows-tests:
    name: Windows tests (.NET)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        shell: pwsh
        run: ./scripts/build-windows-core.ps1

      - name: Run xUnit tests
        run: >
          dotnet test platforms/windows.tests/AutoWifi.Windows.Tests.csproj
          -c Release
          --logger "console;verbosity=normal"

  ios-tests:
    name: iOS tests (XCTest)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build XCFramework
        run: scripts/build-ios-core.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate

      - name: Run XCTest
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project platforms/ios/AutoWifi.xcodeproj \
            -scheme AutoWifi \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  android-tests:
    name: Android tests (JUnit)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image already ships JDK 17, the Android SDK with platform
      # 35 and build-tools 35.0.0, so no SDK installation is needed here.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run JVM unit tests
        working-directory: platforms/android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

  # The build jobs do not consume anything from the test jobs, so they start
  # immediately instead of waiting for every test to finish. A failing test
  # still fails the workflow run.
  build-macos:
    name: Build macOS app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        run: cargo build --manifest-path core/Cargo.toml -p autowifi-ffi --release

      - name: Package app
        env:
          SIGN_IDENTITY: ""
        run: scripts/package-app.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWifi-macos
          path: dist/AutoWifi-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build XCFramework
        run: scripts/build-ios-core.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate

      - name: Build for simulator
        run: >
          xcodebuild
          -project platforms/ios/AutoWifi.xcodeproj
          -scheme AutoWifi
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive unsigned device build
        run: |
          mkdir -p dist
          xcodebuild \
            -project platforms/ios/AutoWifi.xcodeproj \
            -scheme AutoWifi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath dist/AutoWifi-ios.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # Zip the archive so the release asset keeps the .xcarchive name.
      - name: Package archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/AutoWifi-ios.xcarchive dist/AutoWifi-ios.xcarchive.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWifi-ios
          path: dist/AutoWifi-ios.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        shell: pwsh
        run: ./scripts/build-windows-core.ps1

      - name: Build and publish app
        run: >
          dotnet publish platforms/windows/AutoWifi.Windows.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o dist/windows

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/AutoWifi-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWifi-windows
          path: dist/AutoWifi-windows.zip
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The runner image ships NDK 27.3 and the Android SDK; only cargo-ndk is
      # installed, from a prebuilt release instead of compiling it.
      - name: Ensure cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            curl -fsSL \
              https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz \
              | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-ndk'
          fi
          cargo ndk --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build JNI libraries
        run: scripts/build-android-core.sh

      - name: Build debug APK
        working-directory: platforms/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoWifi-android
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Every master build publishes a release whose tag carries the workflow run
  # number, so successive builds never overwrite each other.
  release:
    name: Publish release
    needs: [build-macos, build-ios, build-windows, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          cp artifacts/AutoWifi-macos/AutoWifi-macos.zip release/
          cp artifacts/AutoWifi-ios/AutoWifi-ios.xcarchive.zip release/
          cp artifacts/AutoWifi-windows/AutoWifi-windows.zip release/
          cp artifacts/AutoWifi-android/app-debug.apk release/AutoWifi-android-debug.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          由 master 自动构建：${GITHUB_SHA}

          - macOS：AutoWifi-macos.zip（未签名）
          - Windows：AutoWifi-windows.zip
          - iOS：AutoWifi-ios.xcarchive.zip（未签名）
          - Android：AutoWifi-android-debug.apk（debug 签名）

          这些构建未做代码签名，仅用于测试；正式发布需要各自平台的签名流程。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "AutoWifi $TAG" \
              --notes-file notes.md \
              release/*
          fi
          echo "### 已发布 $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

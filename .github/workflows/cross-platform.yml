name: Cross-platform CI

on:
  # Pull requests are tested through `pull_request`; pushing a branch twice
  # would otherwise run the whole pipeline twice. Master still gets a full run
  # for every commit so a release can rely on it.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its previous run. Master runs get a
# unique group each, so no commit's run is ever replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with the app version (scripts/package-app.sh, Android
  # versionName). Each master build becomes v<APP_VERSION>.<run_number>.
  APP_VERSION: "1.0"

jobs:
  # Pull requests that only touch prose skip the platform jobs. The filter is a
  # job rather than a workflow-level `paths` filter so every check still gets
  # reported (as skipped) instead of staying pending forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  core-tests:
    name: Core tests (Rust)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Run workspace tests
        run: cargo test --manifest-path core/Cargo.toml --workspace

  macos-tests:
    name: macOS tests (Swift + Rust)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        run: cargo build --manifest-path core/Cargo.toml -p via-ffi --release

      # The release build of the app itself is covered by build-macos; running
      # it here as well only repeats work.
      - name: Run Swift tests
        run: swift test

  windows-tests:
    name: Windows tests (.NET)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        shell: pwsh
        run: ./scripts/build-windows-core.ps1

      - name: Run xUnit tests
        run: >
          dotnet test platforms/windows.tests/Via.Windows.Tests.csproj
          -c Release
          --logger "console;verbosity=normal"

  ios-tests:
    name: iOS tests (XCTest)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build XCFramework
        run: scripts/build-ios-core.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate

      - name: Run XCTest
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project platforms/ios/Via.xcodeproj \
            -scheme Via \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  android-tests:
    name: Android tests (JUnit)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner image already ships JDK 17, the Android SDK with platform
      # 35 and build-tools 35.0.0, so no SDK installation is needed here.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Run JVM unit tests
        working-directory: platforms/android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

  # The build jobs do not consume anything from the test jobs, so they start
  # immediately instead of waiting for every test to finish. A failing test
  # still fails the workflow run.
  build-macos:
    name: Build macOS app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        run: cargo build --manifest-path core/Cargo.toml -p via-ffi --release

      - name: Package app
        env:
          SIGN_IDENTITY: ""
        run: scripts/package-app.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Via-macos
          path: dist/Via-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build XCFramework
        run: scripts/build-ios-core.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate

      - name: Build for simulator
        run: >
          xcodebuild
          -project platforms/ios/Via.xcodeproj
          -scheme Via
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive unsigned device build
        run: |
          mkdir -p dist
          xcodebuild \
            -project platforms/ios/Via.xcodeproj \
            -scheme Via \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath dist/Via-ios.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # Zip the archive so the release asset keeps the .xcarchive name.
      - name: Package archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/Via-ios.xcarchive dist/Via-ios.xcarchive.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Via-ios
          path: dist/Via-ios.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build policy core
        shell: pwsh
        run: ./scripts/build-windows-core.ps1

      # .NET Framework 4.8 is part of Windows, so the publish output is just
      # the exe (with the Rust core embedded) of roughly 1 MB.
      - name: Publish portable app
        run: >
          dotnet publish platforms/windows/Via.Windows.csproj
          -c Release
          -p:Platform=x64
          -o dist/windows-portable

      # Installer payload: the same app plus the core DLL next to it, which
      # Inno Setup packs into setup.exe.
      - name: Publish installer payload
        run: >
          dotnet publish platforms/windows/Via.Windows.csproj
          -c Release
          -p:Platform=x64
          -o dist/windows-app

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable exe and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/windows-portable/Via.exe dist/release/Via-windows-portable.exe
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" platforms/windows/installer.iss
          Copy-Item dist/Via-windows-setup.exe dist/release/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Via-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android app
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The runner image ships NDK 27.3 and the Android SDK; only cargo-ndk is
      # installed, from a prebuilt release instead of compiling it.
      - name: Ensure cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            curl -fsSL \
              https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz \
              | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-ndk'
          fi
          cargo ndk --version

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build JNI libraries
        run: scripts/build-android-core.sh

      - name: Build release APK
        working-directory: platforms/android
        run: >
          gradle assembleRelease
          --no-daemon --stacktrace
          -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/release/app-release.apk dist/Via-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: Via-android
          path: dist/Via-android.apk
          if-no-files-found: error
          retention-days: 14

  # Every master build publishes a release whose tag carries the workflow run
  # number, so successive builds never overwrite each other.
  release:
    name: Publish release
    needs: [build-macos, build-ios, build-windows, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          cp artifacts/Via-macos/Via-macos.zip release/
          cp artifacts/Via-ios/Via-ios.xcarchive.zip release/
          cp artifacts/Via-windows/Via-windows-portable.exe release/
          cp artifacts/Via-windows/Via-windows-setup.exe release/
          cp artifacts/Via-android/Via-android.apk release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          PREV="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
            --json tagName --jq '.[0].tagName' 2>/dev/null || true)"

          # The job has no checkout, so every gh call needs the repository.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Build the release body from the commits since the previous
            # release. GitHub's own note generation only lists pull requests,
            # and this project pushes to master directly.
            {
              echo "## 变更"
              echo
              # Compare against the commit, not the tag: the tag is only
              # created by `gh release create` a few lines below.
              if [ -n "$PREV" ]; then
                gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_SHA" \
                  --jq '.commits[] | "- " + (.commit.message | split("\n")[0])'
                echo
                echo "**完整变更**：https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_SHA"
              else
                gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&per_page=10" \
                  --jq '.[] | "- " + (.commit.message | split("\n")[0])'
                echo
                echo "**完整变更**：https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_SHA"
              fi
            } > notes.md

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Via $TAG" \
              --notes-file notes.md \
              release/*
          fi
          echo "### 已发布 $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

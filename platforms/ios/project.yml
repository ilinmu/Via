name: Via
options:
  bundleIdPrefix: io.github.ilinmu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Via:
    type: application
    platform: iOS
    sources:
      - path: Via
        excludes:
          - "Info.plist"
          - "Via.entitlements"
          - "Via-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilinmu.via
        PRODUCT_NAME: Via
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Via/Info.plist
        CODE_SIGN_ENTITLEMENTS: Via/Via.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Via/Via-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks/include
        OTHER_LDFLAGS: $(inherited) -framework NetworkExtension -framework CoreLocation -framework Security
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - framework: Frameworks/ViaCore.xcframework
        embed: false

  ViaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ViaTests
    dependencies:
      - target: Via
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ilinmu.via.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Via.app/Via
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Via:
    build:
      targets:
        Via: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ViaTests
    archive:
      config: Release

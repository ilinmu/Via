name: AutoWifi
options:
  bundleIdPrefix: com.autowifi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AutoWifi:
    type: application
    platform: iOS
    sources:
      - path: AutoWifi
        excludes:
          - "Info.plist"
          - "AutoWifi.entitlements"
          - "AutoWifi-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autowifi.ios
        PRODUCT_NAME: AutoWifi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AutoWifi/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoWifi/AutoWifi.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AutoWifi/AutoWifi-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks/include
        OTHER_LDFLAGS: $(inherited) -framework NetworkExtension -framework CoreLocation -framework Security
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - framework: Frameworks/AutoWifiCore.xcframework
        embed: false

  AutoWifiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AutoWifiTests
    dependencies:
      - target: AutoWifi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autowifi.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AutoWifi.app/AutoWifi
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AutoWifi:
    build:
      targets:
        AutoWifi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AutoWifiTests
    archive:
      config: Release
